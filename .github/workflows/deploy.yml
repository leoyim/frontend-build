name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install CJK fonts (PDF 中文渲染)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate PDF
        run: npm run generate-pdf
      - name: Assemble site under /frontend-build/
        run: |
          mkdir -p pages/frontend-build
          cp -R build/. pages/frontend-build/
          printf '%s\n' '<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=/frontend-build/"><title>前端打包构建</title></head><body><a href="/frontend-build/">进入《前端打包构建：从底层原理到工程实践》</a></body></html>' > pages/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4